<!DOCTYPE html>
<htmllang="en">
<head>
  <meta charest="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="gallery-header">
    <h1>Gallery</h1>
    <p class="subtitle">A small collection of landscapes, portraits and architecture.</p>
  
  </header>

  <nav class="fitlers" aria-label="Filter gallery by category">
    <button class="filter-btn active" data-filter="all">ALL</button>
    <button class="filter-btn" data-filter="landscapes">Landscapes</button>
    <button class="filter-btn" data-filter="portraits">Portraits</button>
    <button class="filter-btn" data-filter="architecture">Architecture</button>
</nav>

<main class="gallery" id="gallery" id="gallery">
  <figure class="card" data-category="landscapes">
    <img src="" alt="Misty mountain valley at dawn" loading="lazy">
  <div class="card-overlay">
    <h2 class="card-title">Misty Valley</h2>
    <span class="tag">Landscapes</span>
    <p class="card-desc">Low clouds settling between ridgelines just after sunrise.</p>
  </div>
  </figure>

  <figure class="card" data-category="landscapes">
    <img src="" alt="River winding through a green gorge" loading="lazy">
  <div class="card-overlay">
    <h2 class="card-title">River Bend</h2>
    <span class="tag">Landscapes</span>
    <p class="card-desc">A slow river cutting through a narrow, forested gorge.</p>
  </div>
</figure>


<figure class="card" data-category="landscapes">
  <img src="" alt="Wide open field under a dramatic sky" loading="lazy">
  <div class="card-overlay">
    <h2 class="card-title">Open Field</h2>
    <span class="tag">Landscapes</span>
    <p class="card-desc">Storm light breaking across an empty plain in late afternoon.</p>
  </div>
</figure>

<figure class="card" data-category="landscapes">
  <img src="" alt="Waterfall in a rocky forest" loading="lazy">
  <div class="card-overlay">
    <h2 class="card-title">Falling Water</h2>
    <span class="tag">Landscapes</span>
    <p class="card-desc">A long exposure of a waterfall tucked into dense woodland.</p>
</div>
</figure>

<figure class="card" data-category="portraits">
  <img src="" alt="Portrait of woman looking off camera" loading="lazy">
<div class="card-overlay">
  <h2 class="card-title">Quiet Gaze</h2>
  <span class="tag">Portraits</span>
  <p class="card-desc">Window light and a still expression, shot at close range.</p>
</div>
</figure>

<figure class="card" data-category="portraits">
  <img src="" alt="Portraits of a man in natural light" loading="lazy">
<div class="card-overly">
  <h2 class="card-title">Soft Light</h2>
  <span class="tag">Portraits</span>
  <p class="card-desc">Natural light portrait with a shallow depth of field.</p>
</div>
</figure>

<figure class="card" data-category="landscape">
  <img src="" alt="Wide open field under a dramatic sky" loading="lazy">
<div class="card-overly">
  <h2 class="card-title">Candid Smile</h2>
  <span class="tag">Potraits</span>
  <p class="card-desc">An unposed moment caught between frames.</p>
</div>
</figure class="card" data-category="portraits">
 <img src="" alt="Portrait in profile against a plain bakground" loading="lazy">
 <div class="card-overlay">
  <h2 class="card-title">Profile Study</h2>
  <span class="tag">Portraits</span>
  <p class="card-desc">A simple profile study against a neutral backdrop.</p> </div>
</figure>
<figure class="card" data-category="architect">
  <img src="" alt="Modern building facade with repeating windows" loading="lazy">
  <div class="card-overlay">
    <h2 class="card-title">Repeat Pattern</h2>
    <span class="tag">Architecture</span>
    <p class="card-desc">A grid of windows turned into an accidental pattern.</p>
</div>
</figure>
<figure class="card" data-category="architecture">
  <img src="" alt="Glass skyscraper reflecting the sky" loading="lazy">
  <div class="card-overlay">
    <h2 class="card-title">Glass Tower</h2>
    <span class="tag">Architecture</span>
    <p class="card-desc">Curtain-wall glazing mirroring the clouds above.</p>
</div>
</figure>

<figure class="card" data-category="architecture">
  <img src="" alt="Old stone building with arched doorways" loading="lazy">
  <div class="card-overlay">
    <h2 class="card-title">Stone Arches</h2>
    <span class="tag">Architecture</span>
    <p class="card-desc">Weathered masonry and deep arches in an old quarter.</p>
</div>
</figure>

<figure class="card" data-category="architecture">
  <img src="" alt="Concrete staircase with strong shadows" loading="lazy">
  <div class="card-overlay">
    <h2 class="card-title">Hard Shadows</h2>
    <span class="tag">Architecture</span>
    <p class="card-desc">Brutalist concrete and the geometry of midday sun.</p>
  </div>
</figure>
</main>

<script>
    const buttons = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.card');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const filter = btn.dataset.filter;

        cards.forEach(card => {
          const match = filter === 'all' || card.dataset.category === filter;
          card.classList.toggle('is-hidden', !match);
        });
      });
    });
  </script>





</body>





</html>
